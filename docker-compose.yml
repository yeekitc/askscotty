# Docker runs the fiddly parts: the Postgres database and the Django API.
#
# The frontend (frontend/app) is NOT in here on purpose. It runs on your own
# machine with `npx expo start`, because Expo needs direct network access to
# talk to your phone, simulator, and browser.
#
# Start everything:  ./setup.sh   (first time)  /  docker compose up -d  (later)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-askscotty}
      POSTGRES_USER: ${POSTGRES_USER:-askscotty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askscotty}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The database port is deliberately NOT published to your machine. The API
    # reaches it over Docker's internal network. Publishing 5432 is the single
    # most common first-run failure, because anyone with Postgres already
    # installed gets "address already in use". If you want to connect a database
    # GUI, uncomment these two lines:
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askscotty} -d ${POSTGRES_DB:-askscotty}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Values come from the root .env when it exists, otherwise these defaults
    # apply. Using interpolation rather than `env_file:` means `docker compose
    # up` still works for someone who has not run ./setup.sh yet.
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-askscotty-hackathon}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-askscotty}
      POSTGRES_USER: ${POSTGRES_USER:-askscotty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askscotty}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # External services. Blank is fine — the backend boots without them and
      # only complains when you use a feature that needs one. Set real values in
      # the root .env (see .env.example).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
      # The planner's knobs. Listed individually because compose does not pass
      # the host environment through — a variable missing here cannot be set at
      # all, whatever .env says.
      PLANNER_EFFORT: ${PLANNER_EFFORT:-}
      # The two ids `manage.py provision_planner` prints. Without these lines the
      # planner cannot see them however faithfully they were copied into .env,
      # and every question fails with "not provisioned".
      PLANNER_AGENT_ID: ${PLANNER_AGENT_ID:-}
      PLANNER_ENVIRONMENT_ID: ${PLANNER_ENVIRONMENT_ID:-}
      PLANNER_SESSION_BUDGET_CENTS: ${PLANNER_SESSION_BUDGET_CENTS:-}
      PLANNER_REQUEST_TIMEOUT: ${PLANNER_REQUEST_TIMEOUT:-}
      PLANNER_MAX_RETRIES: ${PLANNER_MAX_RETRIES:-}
      PLANNER_CITATION_MARKERS: ${PLANNER_CITATION_MARKERS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:-}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-}
    volumes:
      # Your local backend/ folder is live-mounted, so editing Python files
      # reloads the server automatically — no rebuild needed.
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Overrides the image's gunicorn CMD with Django's auto-reloading dev server.
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
