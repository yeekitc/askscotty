<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 280px;
        padding: 16px;
        margin: 0;
        background: #0f0f0f;
        color: #f0f0f0;
      }
      h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
        color: #fff;
      }
      p {
        font-size: 12px;
        color: #888;
        margin: 0 0 16px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #888;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        color: #f0f0f0;
        font-size: 12px;
        padding: 7px 10px;
        margin-bottom: 12px;
        outline: none;
      }
      input:focus {
        border-color: #555;
      }
      button {
        width: 100%;
        padding: 9px;
        border-radius: 6px;
        border: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
        margin-bottom: 8px;
        transition: background 0.15s;
      }
      button:hover { background: #1d4ed8; }
      button:disabled { background: #333; color: #666; cursor: default; }
      #status {
        font-size: 12px;
        min-height: 18px;
        text-align: center;
        border-radius: 5px;
        padding: 5px 8px;
        margin-top: 4px;
      }
      .ok  { background: #14532d; color: #86efac; }
      .err { background: #450a0a; color: #fca5a5; }
      .info { color: #888; }
      hr { border: none; border-top: 1px solid #222; margin: 12px 0; }
      #site-label {
        font-size: 12px;
        color: #aaa;
        margin-bottom: 10px;
      }
      .site-badge {
        display: inline-block;
        background: #222;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 11px;
        color: #ccc;
        margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <h2>AskScotty Demo Connector</h2>
    <p>Sends this tab's cookies to your local AskScotty session.</p>

    <div id="site-label">
      Current site: <span id="site-badge" class="site-badge">—</span>
    </div>

    <label>AskScotty backend URL</label>
    <input id="backend-url" type="text" value="http://localhost:8000" />

    <label>AskScotty session ID</label>
    <input id="session-id" type="text" placeholder="Paste from app Local Storage" />

    <button id="connect-btn" disabled>Connect</button>
    <div id="status" class="info">Open a Gradescope or Piazza tab first.</div>

    <script src="popup.js"></script>
  </body>
</html>
